[project]
name = "sequa"
version = "0.4.0"
description = "Snapshot Testing for LLM Applications"
readme = "README.md"
authors = [
    { name = "thetechnoadvisor", email = "thetechnoadvisor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain-groq>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "nemoguardrails>=0.23.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.0.0"]
langgraph = ["langgraph>=0.2.0"]


[project.scripts]
sequa = "sequa.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
