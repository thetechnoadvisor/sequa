name: Publish to PyPI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'pyproject.toml'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version in pyproject.toml was updated
        id: check_version
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff -U0 HEAD~1 HEAD pyproject.toml | grep -E '^\+[[:space:]]*version[[:space:]]*=' > /dev/null; then
              echo "version_updated=true" >> $GITHUB_OUTPUT
              echo "Version in pyproject.toml was updated in this commit."
            else
              echo "version_updated=false" >> $GITHUB_OUTPUT
              echo "Version in pyproject.toml was NOT updated in this commit."
            fi
          else
            echo "version_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check_version.outputs.version_updated == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        if: steps.check_version.outputs.version_updated == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        if: steps.check_version.outputs.version_updated == 'true'
        run: |
          uv build

      - name: Publish package distributions to PyPI
        if: steps.check_version.outputs.version_updated == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}


